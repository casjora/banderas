<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banderas de Paises</title>
    <script type="module" src="/src/scripts/main.js"></script>

  </head>
  <body class="bg-slate-50 dark:bg-[#202d36] dark:text-white">

    <header class="bg-white dark:bg-[#2b3743]">
      <div class=" px-5 flex items-center justify-between h-25 text-lg font-bold shadow">
        <h1>Where in the world?</h1>
        <div>
          <button  class="dark-button block dark:hidden">🌑 Dark Mode</button>
          <button  class="dark-button hidden dark:block">🌞 Light Mode</button>

        </div>
      </div>
    </header>
    <main class="pt-5" id="main">
      <section class="md:px-10 md:flex-row md:justify-between flex flex-col gap-4 mb-5">
        <input class=" dark:bg-[#2b3743] dark:text-white bg-white px-5 py-5 shadow mb-5" type="text" id="search-bar" placeholder="🔎 Search for a country...">
        <select class="dark:bg-[#2b3743] dark:text-white  shadow bg-white w-62.5 px-7 py-5" name="region-section" id ="region-section">
          <!-- puede hacerse con js ya que region es propiedad del objeto -->
          <option value="default" selected>Filter by region</option>
        </select>
      </section>

      <section id="countries-section" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-10 justify-items-center px-5 md:px-10">
        <!-- seccion de tarjetas de paises -->
         <!-- estilos de tarjeta
          class="max-w-75 bg-white rounded-md overflow-hidden" -->

      </section>
    </main>

  </body>
</html>
